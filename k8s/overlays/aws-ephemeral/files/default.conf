# The ephemeral environment exposes this pod directly through hostPort 80.
# Therefore $remote_addr is the TCP peer and is the only trusted client-IP
# key. Do not enable real_ip_header or trust arbitrary X-Forwarded-For.
limit_conn_zone $binary_remote_addr zone=connections_per_ip:1m;
limit_req_zone $binary_remote_addr zone=web_per_ip:1m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_per_ip:1m rate=15r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=register_per_ip:1m rate=2r/m;
limit_req_zone $binary_remote_addr zone=checkout_per_ip:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lead_per_ip:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=view_per_ip:1m rate=30r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;
  client_body_timeout 60s;

  limit_conn connections_per_ip 30;
  limit_conn_status 429;
  limit_req_status 429;
  limit_req_log_level notice;

  # These regex locations include a path-segment boundary so normalized
  # trailing slashes and Spring-style semicolon path parameters cannot fall
  # through to the larger generic API budget.
  location ~ "^/api(?:;[^/]*)?/auth(?:;[^/]*)?/login(?:/|;|$)" {
    limit_req zone=login_per_ip burst=5 nodelay;
    add_header X-RateLimit-Policy login always;
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  location ~ "^/api(?:;[^/]*)?/auth(?:;[^/]*)?/register(?:/|;|$)" {
    limit_req zone=register_per_ip burst=2 nodelay;
    add_header X-RateLimit-Policy register always;
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  location ~ "^/api(?:;[^/]*)?/v1(?:;[^/]*)?/authentication(?:;[^/]*)?/check-unique-taken(?:/|;|$)" {
    limit_req zone=register_per_ip burst=8 nodelay;
    add_header X-RateLimit-Policy register always;
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  # Checkout creation and browser-return verification can create or mutate
  # commerce state, so they receive their own per-IP budget.
  location ~ "^/api(?:;[^/]*)?/v1(?:;[^/]*)?/checkout(?:;[^/]*)?/sessions(?:/|;|$)" {
    limit_req zone=checkout_per_ip burst=5 nodelay;
    add_header X-RateLimit-Policy checkout always;
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  location ~ "^/api(?:;[^/]*)?/v1(?:;[^/]*)?/payments(?:;[^/]*)?/razorpay(?:;[^/]*)?/verify(?:/|;|$)" {
    limit_req zone=checkout_per_ip burst=5 nodelay;
    add_header X-RateLimit-Policy checkout always;
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  # Anonymous lead capture writes durable customer data. Product IDs remain a
  # numeric path segment, including an optional Spring-style matrix suffix.
  location ~ "^/api(?:;[^/]*)?/public(?:;[^/]*)?/products(?:;[^/]*)?/[0-9]+(?:;[^/]*)?/leads(?:/|;|$)" {
    limit_req zone=lead_per_ip burst=5 nodelay;
    add_header X-RateLimit-Policy lead always;
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  # A storefront view is best-effort analytics: callers may discard 429 and
  # continue rendering the page. Its larger budget protects the API without
  # coupling storefront availability to analytics ingestion.
  location ~ "^/api(?:;[^/]*)?/events(?:;[^/]*)?/view(?:/|;|$)" {
    limit_req zone=view_per_ip burst=60 nodelay;
    add_header X-RateLimit-Policy view always;
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  # Provider webhook source addresses may be shared. Their signatures and
  # idempotency checks are the primary controls; the connection cap still
  # applies, but a per-IP request budget could drop valid payment events.
  location = /api/v1/webhooks/razorpay {
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  location = /api/v1/webhooks/stripe {
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  location = /api/v1/webhooks/instagram {
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=30 nodelay;
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  location = /health {
    limit_req zone=api_per_ip burst=10 nodelay;
    # The operator-side verifier compares this observed peer to the Terraform
    # security-group allowlist and verifies that spoofed XFF is ignored.
    add_header X-Creator-Edge-Peer $remote_addr always;
    include /etc/nginx/proxy_params;
    proxy_pass http://creator-store-api:8080;
  }

  location / {
    limit_req zone=web_per_ip burst=60 nodelay;
    try_files $uri $uri/ /index.html;
  }
}
