apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: creator-store-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  tagSpecification_1: Project=creator-store
  tagSpecification_2: Environment=ephemeral-test
  tagSpecification_3: TestId=replace-with-test-id
  tagSpecification_4: ExpiresAt=replace-with-expires-at
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
