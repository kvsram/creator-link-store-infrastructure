apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-store-api
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-store-web
spec:
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: creator-store-web
spec:
  type: NodePort
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: creator-store-uploads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: creator-store-runtime
data:
  APP_ALLOWED_ORIGINS: http://replace-with-worker-ip:30080
  APP_SECURE_COOKIES: "false"
  PAYMENTS_MODE: disabled
  INSTAGRAM_MODE: disabled
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creator-store
$patch: delete
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: creator-store-api
$patch: delete
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: creator-store-api
$patch: delete
