apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-store-web
spec:
  replicas: 2
  selector:
    matchLabels: {app: creator-store-web}
  template:
    metadata:
      labels: {app: creator-store-web}
    spec:
      containers:
        - name: web
          image: ghcr.io/kvsram/creator-link-store-frontend:replace-with-sha
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}}
          livenessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: creator-store-web
spec:
  selector: {app: creator-store-web}
  ports: [{name: http, port: 80, targetPort: http}]
