apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creator-store
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 55m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [creator.example.com]
      secretName: creator-store-tls
  rules:
    - host: creator.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: creator-store-api, port: {number: 8080}}}
          - path: /health
            pathType: Exact
            backend: {service: {name: creator-store-api, port: {number: 8080}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: creator-store-web, port: {number: 80}}}
