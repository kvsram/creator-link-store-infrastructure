apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: creator-store-api
spec:
  minAvailable: 1
  selector: {matchLabels: {app: creator-store-api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: creator-store-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: creator-store-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector: {matchLabels: {app: creator-store-api}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: creator-store-web}}}]
      ports: [{protocol: TCP, port: 8080}]
