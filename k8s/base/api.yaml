apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-store-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: creator-store-api}
  template:
    metadata:
      labels: {app: creator-store-api}
    spec:
      serviceAccountName: creator-store-api
      containers:
        - name: api
          image: ghcr.io/kvsram/creator-link-store-backend:replace-with-sha
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: creator-store-runtime}
            - secretRef: {name: creator-store-runtime-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: creator-store-api
spec:
  selector: {app: creator-store-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: creator-store-api
  annotations:
    eks.amazonaws.com/role-arn: replace-with-irsa-role-arn
