name: Infrastructure quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.5 }
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate Terraform roots without contacting AWS
        shell: bash
        run: |
          for root in terraform/bootstrap terraform/environments/production terraform/environments/regional; do
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done

  validate-local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate three-container topology
        run: docker compose -f local/docker-compose.yml config
      - name: Render Kubernetes base
        run: |
          kubectl kustomize k8s/base >/dev/null
          for cloud in aws azure oci; do kubectl kustomize "k8s/overlays/$cloud" >/dev/null; done
      - name: Verify operator documentation is present
        run: |
          bash -n scripts/bootstrap-local.sh scripts/doctor.sh scripts/smoke-test.sh
          test -x scripts/bootstrap-local.sh
          test -x scripts/doctor.sh
          test -x scripts/smoke-test.sh
          test -s docs/AI_HANDOFF.md
          test -s docs/FEATURE_PARITY.md
          test -s docs/LOCAL_SETUP.md
          test -s docs/AWS_REGIONAL_BOOTSTRAP.md
          test -s docs/product-design.md
          test -s docs/api-contract.md
          test -s docs/production-runbook.md
          test -s docs/india-launch-integrations.md
          test -s docs/release-architecture.md
          test -s docs/backend-architecture.md
          test -s docs/MULTICLOUD_DEPLOYMENT.md
          test -s docs/INSTAGRAM_AUTODM.md
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
