name: Infrastructure quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.5 }
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate Terraform roots without contacting AWS
        shell: bash
        run: |
          for root in terraform/bootstrap terraform/bootstrap-ephemeral terraform/environments/production terraform/environments/regional terraform/environments/ephemeral-test terraform/clouds/azure terraform/clouds/oci; do
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done

  validate-local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate three-container topology
        run: docker compose -f local/docker-compose.yml config
      - name: Render Kubernetes base
        run: |
          kubectl kustomize k8s/base >/dev/null
          for cloud in aws azure oci; do kubectl kustomize "k8s/overlays/$cloud" >/dev/null; done
          kubectl kustomize k8s/overlays/aws-ephemeral > /tmp/aws-ephemeral.yaml
          grep -q 'nodePort: 30080' /tmp/aws-ephemeral.yaml
          grep -q 'hostPort: 80' /tmp/aws-ephemeral.yaml
          grep -q 'type: Recreate' /tmp/aws-ephemeral.yaml
          grep -q 'externalTrafficPolicy: Local' /tmp/aws-ephemeral.yaml
          grep -q 'storageClassName: local-path' /tmp/aws-ephemeral.yaml
          test "$(grep -c 'replicas: 1' /tmp/aws-ephemeral.yaml)" -eq 2
          ! grep -q 'kind: Ingress' /tmp/aws-ephemeral.yaml
          ! grep -q 'kind: HorizontalPodAutoscaler' /tmp/aws-ephemeral.yaml
          ! grep -q 'kind: PodDisruptionBudget' /tmp/aws-ephemeral.yaml
          ! grep -Rq 'aws_eks\|module "eks"\|ebs.csi.aws.com' terraform/environments/ephemeral-test k8s/overlays/aws-ephemeral
          grep -q 'cluster-cidr: "${k3s_pod_cidr}"' terraform/environments/ephemeral-test/cloud-init/k3s.sh.tftpl
          grep -q 'service-cidr: "${k3s_service_cidr}"' terraform/environments/ephemeral-test/cloud-init/k3s.sh.tftpl
      - name: Verify operator documentation is present
        run: |
          bash -n scripts/bootstrap-local.sh scripts/doctor.sh scripts/smoke-test.sh scripts/product-types-smoke-test.sh scripts/deploy-aws-ephemeral.sh scripts/deploy-k3s-node.sh scripts/verify-aws-ephemeral.sh scripts/verify-k3s-node.sh
          test -x scripts/bootstrap-local.sh
          test -x scripts/doctor.sh
          test -x scripts/smoke-test.sh
          test -x scripts/product-types-smoke-test.sh
          test -x scripts/deploy-aws-ephemeral.sh
          test -x scripts/deploy-k3s-node.sh
          test -x scripts/verify-aws-ephemeral.sh
          test -x scripts/verify-k3s-node.sh
          test -s docs/AI_HANDOFF.md
          test -s docs/FEATURE_PARITY.md
          test -s docs/LOCAL_SETUP.md
          test -s docs/AWS_REGIONAL_BOOTSTRAP.md
          test -s docs/product-design.md
          test -s docs/api-contract.md
          test -s docs/production-runbook.md
          test -s docs/india-launch-integrations.md
          test -s docs/release-architecture.md
          test -s docs/backend-architecture.md
          test -s docs/MULTICLOUD_DEPLOYMENT.md
          test -s docs/INSTAGRAM_AUTODM.md
          test -s terraform/clouds/azure/README.md
          test -s terraform/clouds/oci/README.md
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
